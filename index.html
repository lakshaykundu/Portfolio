<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Head-and-shoulders crop of the kickboxer render. favicon.ico is the fallback browsers
         request on their own. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <title>Lakshay Kumar · Frontend Engineer</title>
    <meta
      name="description"
      content="Lakshay Kumar, frontend engineer. I build scalable products and optimise them to stay fast, with React, Chrome extensions and AI agents."
    />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Link previews (LinkedIn, WhatsApp, X…). They need absolute URLs; see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Lakshay Kumar · Frontend Engineer" />
    <meta
      property="og:description"
      content="Scalable, fast products with React, Chrome extensions and AI agents. Scroll to follow my story."
    />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lakshay Kumar, Frontend Engineer, beside a kickboxer figure" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
